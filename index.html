    <style>:root{--coral:#e4453a;--teal:#3b82c4;--violet:#8b5cf6;--amber:#f4a100;--sky:#0ea5e9;--leaf:#2fa84f;--indigo:#4f46e5;--muted:#64748b;--feedback-bad-ink:#e4453a}*{box-sizing:border-box;margin:0;padding:0}body{color:#333;background:#f8f9fa;font-family:Nunito,sans-serif;line-height:1.5}.home-head{text-align:center;padding:20px}.home-head h1{margin-bottom:10px;font-family:"Baloo 2",cursive;font-size:2.5rem}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:0 20px;display:grid}.card{background:#fff;border-radius:16px;padding:20px;transition:transform .2s;box-shadow:0 2px 8px #0000001a}.card:hover{transform:translateY(-2px)}.card .icon{margin-bottom:10px;font-size:2.5rem}.next-btn{background:var(--violet);color:#fff;cursor:pointer;border:none;border-radius:12px;width:100%;margin-top:20px;padding:12px 24px;font-size:1rem;font-weight:700}.back{cursor:pointer;background:0 0;border:none;margin-left:16px;padding:8px 16px;font-size:1rem}.topbar{background:#fff;border-bottom:1px solid #eee;justify-content:space-between;align-items:center;padding:16px 20px;display:flex}.profile-chip{background:#fff;border:1px solid #ddd;border-radius:20px;align-items:center;gap:8px;padding:8px 16px;font-weight:600;display:flex}.mini-avatar{font-size:1.2rem}.loading-wrap{text-align:center;padding:40px 20px}.q-card{background:#fff;border-radius:16px;margin:20px;padding:24px;box-shadow:0 2px 8px #0000001a}.prompt{text-align:center;margin-bottom:20px;font-size:1.4rem}.options{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;margin-top:20px;display:grid}.opt{cursor:pointer;background:#f8f9fa;border:2px solid #e5e7eb;border-radius:12px;padding:16px;font-size:1.2rem;transition:all .2s}.opt:hover{background:#f3f4f6}.opt.correct{background:#d1fae5;border-color:#2fa84f}.opt.wrong{background:#fee2e2;border-color:#e4453a}.feedback{text-align:center;min-height:24px;margin-top:16px;font-weight:600}.feedback.good{color:#2fa84f}.feedback.bad{color:#e4453a}.progress{background:#e5e7eb;border-radius:2px;width:100%;height:4px;overflow:hidden}.counter{color:#64748b;font-size:.9rem}.stat-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:20px;padding:0 20px;display:grid}.stat-card{text-align:center;background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0000001a}.stat-card .num{color:var(--violet);font-size:2rem;font-weight:700}.stat-card .lab{color:#64748b;margin-top:4px;font-size:.9rem}.bars{background:#fff;border-radius:16px;margin:20px;padding:20px;box-shadow:0 2px 8px #0000001a}.bar-row{grid-template-columns:1fr 2fr 60px;align-items:center;gap:10px;margin-bottom:12px;display:grid}.bar-track{background:#f3f4f6;border-radius:10px;height:24px;overflow:hidden}.bar-fill{height:100%;transition:width .3s}.bp{font-weight:600}.history-item{background:#f8f9fa;border-radius:8px;justify-content:space-between;margin-bottom:8px;padding:12px;display:flex}.hd{color:#64748b;font-size:.8rem}.field{border:2px solid #e5e7eb;border-radius:8px;width:100%;padding:12px;font-size:1rem}.field-label{margin-bottom:8px;font-weight:600}.avatar-grid{grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:10px;margin-top:10px;display:grid}.avatar-opt{cursor:pointer;border:2px solid #0000;border-radius:8px;padding:8px;font-size:2rem}.avatar-opt.picked{border-color:var(--violet);background:#f3f4f6}.btn-secondary{color:#333;cursor:pointer;background:#f3f4f6;border:none;border-radius:12px;width:100%;padding:12px 24px;font-size:1rem}.btn-primary{background:var(--violet);color:#fff;cursor:pointer;border:none;border-radius:12px;width:100%;padding:12px 24px;font-size:1rem}.btn-full{width:100%}.done{text-align:center}.done .stars{margin-bottom:20px;font-size:2.5rem}.done-actions{gap:12px;margin-top:24px;display:grid}.diff-note{color:#64748b;margin-top:8px;font-size:.9rem}.empty-note{text-align:center;color:#64748b;padding:20px}.writing-area{margin-top:20px}.writing-input{resize:vertical;border:2px solid #e5e
